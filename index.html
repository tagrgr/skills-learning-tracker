<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillTrack</title>

    <link rel="stylesheet" href="./src/css/reset.css">
    <link rel="stylesheet" href="./src/css/tokens.css">
    <link rel="stylesheet" href="./src/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="icon" href="./images/logo.svg" type="image/svg+xml">

    <script defer src="./src/js/script.js"></script>
</head>
<body>
    <header id="head">
        <div class="wrapper head-inner">
            <div class="left-head">
                <a class="logo" href="#">
                    <img src="./images/logo.svg" alt="SkillTrack logo">
                </a>
                <h1 class="branding">SkillTrack</h1>
            </div>
            
            <div class="right-head">
                <button class="btn-primary" type="button">+ Log Session</button>
                <a class="avatar" href="#">TG</a>
            </div>
        </div>
    </header>

    <main id="container" class="wrapper">
        <section class="greeting">
            <h2 class="greeting-title">Good afternoon, Jordan</h2>
            <p class="greeting-sub">You've practiced 3 skills today. Keep it up!</p>
        </section>

        <div class="dashboard">
            <section class="featured card">
                <p class="featured-label">Most practiced</p>
                <h2 class="featured-name">Spanish</h2>
                
                <div class="ring">
                    <svg viewBox="0 0 120 120">
                        <circle class="ring-track" cx="60" cy="60" r="52"/>
                        <circle class="ring-progress" cx="60" cy="60" r="52"/>
                    </svg>
                    <div class="ring-text">
                        <span class="ring-percent">75%</span>
                        <span class="ring-label">of weekly goal</span>
                    </div>
                </div>
                
                <div class="featured-stats">
                    <div class="stat-box">
                        <span class="skill-value featured-hours">47.5h</span>
                        <span class="skill-stat">Total hours</span>
                    </div>
                    <div class="stat-box">
                        <span class="skill-value featured-streak">🔥 12</span>
                        <span class="skill-stat">Day streak</span>
                    </div>
                </div>

                <p class="featured-last">Last session: Yesterday — 45 min</p>
            </section>
            
            <ul class="skills-grid"></ul>

            <section class="heatmap-panel card">
                <header class="heatmap-head">
                    <h2>Practice Activity</h2>
                    <span>Last 18 weeks</span>    
                </header>
                
                <div class="heatmap"></div>

                <footer class="heatmap-legend">
                    <span>Less</span>
                    <div class="legend-swatch heatmap-empty"></div>
                    <div class="legend-swatch heatmap-light"></div>
                    <div class="legend-swatch heatmap-medium"></div>
                    <div class="legend-swatch heatmap-heavy"></div>
                    <span>More</span>
                </footer>
            </section>
        </div>
    </main>
</body>
</html>
